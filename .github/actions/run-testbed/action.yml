name: Run tactus testbed
description: Configures, starts, follows and collects a tactus integration test suite

inputs:
  test_config:
    description: Path to the test-suite config (relative to repo root)
    required: true
  case_selection:
    description: Comma-separated case names to restrict to (empty = every case in test_config)
    required: false
    default: ""
  ial_version:
    description: >-
      submission.ial_version to force on every generated case config (e.g. the
      ref a preceding compile sub-step just built). Empty = leave each case's
      own default (precompiled binaries) untouched.
    required: false
    default: ""

outputs:
  test_dir:
    description: Directory containing the generated per-case config.toml files
    value: ${{ steps.configure.outputs.test_dir }}
  run_tag:
    description: >-
      Unique [general].tag injected into every case this run (branch_runid_
      runattempt) - every case's ecFlow suite name starts with this. Feed it
      to scripts/ci/sweep_suites.sh to force-remove every suite from this
      run, regardless of whether per-case `tactus remove` succeeded.
    value: ${{ steps.configure.outputs.run_tag }}
  resolved_config:
    description: The top-level test-runner config file this run generated
    value: ${{ steps.configure.outputs.resolved_config }}
  artifact_paths:
    description: >-
      Newline-separated @CASEDIR@ paths (one per case, on HPC scratch) holding
      ci_status.txt/summary.json/summary.txt/*.diff - NOT under test_dir, which
      only ever holds the generated *.toml configs. Feed this directly into
      actions/upload-artifact's `path:` input.
    value: ${{ steps.follow.outputs.artifact_paths }}
  status:
    description: PASS or FAIL
    value: ${{ steps.follow.outputs.status }}

runs:
  using: composite
  steps:
    - id: configure
      name: Generate per-case configs
      shell: bash
      run: |
        set -euo pipefail
        # Always generate a config copy (not just when case_selection is set)
        # so we can also inject a unique [general].tag below - this threads
        # through TestCases.get_tag() (only falls back to the git-derived
        # branch name if [general].tag isn't already present) into every
        # case's case_prefix/general.case/casedir/ecFlow-suite name BEFORE
        # tactus test's own host=-dependency resolution runs, so dependent
        # cases stay consistent (see the "Fix 7" note in the plan for why a
        # post-hoc rename would break host= dependencies instead).
        #
        # Any CI-only submission overrides (account/ial_version) are applied
        # via [general].extra - the same native config-mods mechanism
        # `tactus case` uses, that TestCases.create() (tactus/test_runner.py)
        # already splices into every case's own `tactus case <base>
        # <extra...> <outfile>` invocation. That runs per-case at generation
        # time, through ExpFromFiles' own deep-merge + schema validation,
        # BEFORE host=-dependency resolution.
        #
        # QOS is deliberately NOT overridden here at all (no TACTUS_WLM_QOS
        # variable exists): unlike account, every submission type already
        # has a correct, type-specific default
        # QOS (tactus/data/config_files/include/submission/atos_bologna.toml
        # - e.g. "parallel" gets "np", "gnu"/"serial" get "nf"). A past
        # version of this override forced the SAME QOS across every type,
        # which silently downgraded "parallel" tasks (e.g. Prep, a 32-way
        # MPI srun) from "np" to "nf" - a QOS that doesn't permit that many
        # processors, and SLURM rejected the job with "More processors
        # requested than permitted". A manual `tactus test -m -r` run (no
        # override at all) doesn't hit this, since it keeps each type's own
        # correct QOS.
        #
        # TACTUS_WLM_ACCOUNT is resolved to a literal value right here, in
        # plain bash, rather than written as an @MACRO@ placeholder for
        # tactus to substitute later via os_macros - two reasons: (1) it
        # means a CI run with it unset generates literally no extra mod file
        # at all, so submission is byte-for-byte identical to a plain manual
        # `tactus test -c ... -m -r` - no account override unless one is
        # explicitly configured; (2) it sidesteps a real bug (now also fixed
        # at the source in tactus/submission.py) where the "account" BATCH
        # fallback never went through Platform.substitute(), so a macro
        # there was silently left unexpanded in the generated job script and
        # rejected by sbatch.
        config_file="ci_run_$(basename "${{ inputs.test_config }}")"
        safe_branch=$(echo "${{ github.ref_name }}" | tr -c 'A-Za-z0-9._-' '_')
        run_tag="${safe_branch}_${{ github.run_id }}_${{ github.run_attempt }}"
        poetry run python - "${{ inputs.test_config }}" "$config_file" "${{ inputs.case_selection }}" "$run_tag" \
          ci_submission_override.toml \
          "${TACTUS_WLM_ACCOUNT:-}" "${{ inputs.ial_version }}" <<'PYEOF'
        import sys
        import tomlkit

        src, dest, selection, run_tag, mod_path, account, ial_version = sys.argv[1:8]
        doc = tomlkit.parse(open(src).read())
        if selection:
            doc["general"]["selection"] = [c.strip() for c in selection.split(",") if c.strip()]
        doc["general"]["tag"] = run_tag

        extra = list(doc["general"].get("extra", []))

        override = {}
        if account:
            override.setdefault("submission", {})["account"] = f"#SBATCH --account={account}"
        if ial_version:
            override.setdefault("submission", {})["ial_version"] = ial_version

        if override:
            with open(mod_path, "w") as f:
                f.write(tomlkit.dumps(override))
            extra.append(mod_path)

        doc["general"]["extra"] = extra
        with open(dest, "w") as f:
            f.write(tomlkit.dumps(doc))
        PYEOF
        poetry run tactus test -c "$config_file" -m
        # TestCases.test_dir is derived from [general.tag] (falling back to the
        # git-derived version), not the config file name - ask TestCases itself
        # rather than guessing, so this stays correct regardless of how the
        # config sets (or doesn't set) [general.tag].
        test_dir=$(poetry run python -c "
        import argparse
        from tactus.test_runner import TestCases
        args = argparse.Namespace(config_file='$config_file', verbose=False, dry=False, generate_refs=False)
        print(TestCases(args=args).test_dir)
        ")
        echo "test_dir=$test_dir" >> "$GITHUB_OUTPUT"
        echo "resolved_config=$config_file" >> "$GITHUB_OUTPUT"
        echo "run_tag=$run_tag" >> "$GITHUB_OUTPUT"

    - name: Start suites
      shell: bash
      run: poetry run tactus test -c "${{ steps.configure.outputs.resolved_config }}" -r

    - id: follow
      name: Follow suites and summarize
      shell: bash
      run: |
        set +e
        poetry run python scripts/ci/monitor_suite.py \
          --mode testbed \
          --config "${{ steps.configure.outputs.resolved_config }}" \
          --poll-interval-seconds "${{ env.TACTUS_POLL_INTERVAL_SECONDS || '60' }}" \
          --timeout-minutes "${{ env.TACTUS_SUITE_TIMEOUT_MINUTES || '240' }}" \
          --artifact-manifest ci_artifact_casedirs.txt
        rc=$?
        set -e
        # Each line is a @CASEDIR@ root on HPC scratch (see MonitorTarget.casedir
        # in monitor_suite.py) - turn it into a glob so a case whose casedir gets
        # removed by cleanup before upload-artifact runs doesn't fail the step.
        # monitor_suite.py may have crashed/timed out before ever writing the
        # manifest - don't let a missing file here (sed failing under this
        # shell's default -e) also corrupt the GITHUB_OUTPUT multiline write
        # below with an unclosed delimiter, masking the real error above with
        # a second, unrelated-looking one.
        artifact_paths=""
        if [ -f ci_artifact_casedirs.txt ]; then
          artifact_paths=$(sed 's#$#/**#' ci_artifact_casedirs.txt)
        fi
        {
          echo "artifact_paths<<EOF_ARTIFACT_PATHS"
          echo "$artifact_paths"
          echo "EOF_ARTIFACT_PATHS"
        } >> "$GITHUB_OUTPUT"
        echo "status=$([ $rc -eq 0 ] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
        exit $rc

    - name: Print final case table (informational only)
      if: always()
      shell: bash
      run: poetry run tactus test -c "${{ steps.configure.outputs.resolved_config }}" || true
