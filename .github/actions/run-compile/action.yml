name: Run tactus compile
description: Runs 'tactus compile' for one IAL tag and reports the result to GitHub

inputs:
  ial_tag:
    description: IAL git tag/branch to compile
    required: true
  dry_run:
    description: Only generate the compile config, do not submit (maps to 'tactus compile -d')
    required: false
    default: "false"

outputs:
  config_file:
    description: Path to the generated compile config.toml
    value: ${{ steps.run.outputs.config_file }}
  artifact_paths:
    description: >-
      Newline-separated @CASEDIR@ paths (on HPC scratch) holding ci_status.txt
      for this compile - NOT under the runner's local checkout. Feed this
      directly into actions/upload-artifact's `path:` input.
    value: ${{ steps.summary.outputs.artifact_paths }}
  status:
    description: PASS or FAIL
    value: ${{ steps.summary.outputs.status }}

runs:
  using: composite
  steps:
    - id: run
      name: Generate compile config
      shell: bash
      run: |
        set -euo pipefail
        # ial_tag may contain "/" (e.g. a branch name), which isn't valid in
        # a local file name on the runner - sanitize just for the on-disk
        # config file name. The ecFlow suite/case name is computed by `tactus
        # compile` itself via sanitize_case_name(), no action needed here.
        safe_tag=$(echo "${{ inputs.ial_tag }}" | tr -c 'A-Za-z0-9._-' '_')
        config_file="compile_${safe_tag}.toml"

        # -d/--dry-run only skips auto-starting the suite; config generation
        # (including the three mod files tactus compile hardcodes - @HOST@,
        # compile_suite, compile_@HOST@) always happens.
        poetry run tactus compile \
          --ial-tag "${{ inputs.ial_tag }}" \
          -d \
          -o "$config_file"
        echo "config_file=$config_file" >> "$GITHUB_OUTPUT"

    - name: Apply CI submission overlay to generated compile config
      shell: bash
      run: |
        poetry run python - "${{ steps.run.outputs.config_file }}" \
          tactus/data/config_files/modifications/ci_atos_bologna.toml <<'PYEOF'
        import sys
        import tomlkit

        dest, overlay_file = sys.argv[1:3]
        overlay = tomlkit.parse(open(overlay_file).read())

        def deep_merge(base, extra):
            for key, value in extra.items():
                if key in base and hasattr(base[key], "items") and hasattr(value, "items"):
                    deep_merge(base[key], value)
                else:
                    base[key] = value

        doc = tomlkit.parse(open(dest).read())
        deep_merge(doc, overlay)
        with open(dest, "w") as f:
            f.write(tomlkit.dumps(doc))
        PYEOF

    - name: Start compile suite
      if: ${{ inputs.dry_run != 'true' }}
      shell: bash
      run: poetry run tactus start suite -c "${{ steps.run.outputs.config_file }}"

    - id: summary
      name: Follow suite and summarize
      if: ${{ inputs.dry_run != 'true' }}
      shell: bash
      run: |
        set -o pipefail
        set +e
        poetry run python scripts/ci/monitor_suite.py \
          --mode compile \
          --config "${{ steps.run.outputs.config_file }}" \
          --poll-interval-seconds "${{ env.TACTUS_POLL_INTERVAL_SECONDS || '60' }}" \
          --timeout-minutes "${{ env.TACTUS_SUITE_TIMEOUT_MINUTES || '180' }}" \
          --artifact-manifest ci_artifact_casedirs.txt
        rc=$?
        set -e

        # monitor_suite.py may have crashed/timed out before ever writing
        # the manifest - don't let a missing file here (sed failing under
        # this shell's default -e) also corrupt the GITHUB_OUTPUT multiline
        # write below with an unclosed delimiter, masking the real error
        # above with a second, unrelated-looking one.
        artifact_paths=""
        if [ -f ci_artifact_casedirs.txt ]; then
          artifact_paths=$(sed 's#$#/**#' ci_artifact_casedirs.txt)
        fi
        {
          echo "artifact_paths<<EOF_ARTIFACT_PATHS"
          echo "$artifact_paths"
          echo "EOF_ARTIFACT_PATHS"
        } >> "$GITHUB_OUTPUT"
        echo "status=$([ $rc -eq 0 ] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
        exit $rc
