name: Free local disk (poetry venv + cache)
description: Removes .venv (and its $SCRATCH target, if any), poetry cache, CI config files

inputs:
  extra_patterns:
    description: Extra space-separated glob patterns to remove
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Free local disk (poetry venv + cache)
      shell: bash
      run: |
        set +e
        # .venv may be a symlink into $SCRATCH (see setup-venv-scratch) -
        # free the real target too.
        if [ -L .venv ]; then
          real_venv=$(readlink -f .venv)
          [ -n "$real_venv" ] && rm -rf "$real_venv"
        fi
        rm -rf .venv
        rm -f ci_artifact_casedirs.txt ${{ inputs.extra_patterns }}
        cache_dir=$(poetry config cache-dir 2>/dev/null)
        [ -n "$cache_dir" ] && rm -rf "$cache_dir"
        exit 0
