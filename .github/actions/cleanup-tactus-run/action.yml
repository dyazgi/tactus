name: Cleanup tactus CI run
description: Removes ecFlow suites and ephemeral on-disk artifacts for a tactus CI run

# Leaves persistent paths (install dir, reference-experiment scratch) untouched.

inputs:
  scope:
    description: "compile or testbed"
    required: true
  config_file:
    description: Generated compile config.toml (scope=compile)
    required: false
    default: ""
  test_dir:
    description: Directory of generated per-case config.toml files (scope=testbed)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Remove ecFlow suite(s) and ephemeral workspace
      if: always()
      shell: bash
      run: |
        set -uo pipefail

        if [ "${{ inputs.scope }}" = "compile" ] && [ -n "${{ inputs.config_file }}" ]; then
          if [ -f "${{ inputs.config_file }}" ]; then
            poetry run tactus remove --execute-removal --force-remove "${{ inputs.config_file }}"
          fi
          rm -f "${{ inputs.config_file }}"
        fi

        if [ "${{ inputs.scope }}" = "testbed" ] && [ -n "${{ inputs.test_dir }}" ]; then
          if [ -d "${{ inputs.test_dir }}" ]; then
            for cfg in "${{ inputs.test_dir }}"/*.toml; do
              [ -f "$cfg" ] || continue
              poetry run tactus remove --execute-removal --force-remove "$cfg"
            done
          fi
          rm -rf "${{ inputs.test_dir }}"
        fi

        exit 0
