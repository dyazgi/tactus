name: Point .venv at $SCRATCH
description: Symlinks .venv into $SCRATCH (large quota) instead of this runner's small disk

runs:
  using: composite
  steps:
    - name: Point .venv at $SCRATCH
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_WORKSPACE/.github/sh/helpers.sh"

        scratch="${SCRATCH:-}"
        if [ -z "$scratch" ]; then
          scratch=$(helper_getVar SCRATCH)
        fi
        if [ -z "$scratch" ]; then
          echo "::warning::Could not resolve \$SCRATCH - leaving .venv on this runner's own disk."
          exit 0
        fi

        venv_target="$scratch/tactus/github-runner/$GITHUB_RUN_ID/.venv"
        rm -rf "$venv_target"
        mkdir -p "$venv_target"  # must exist before the symlink, or venv creation fails through it
        rm -rf .venv
        ln -s "$venv_target" .venv
