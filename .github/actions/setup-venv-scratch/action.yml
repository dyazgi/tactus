name: Point .venv at $SCRATCH
description: Creates the venv in $SCRATCH (large quota) and symlinks .venv to it

runs:
  using: composite
  steps:
    - name: Point .venv at $SCRATCH
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_WORKSPACE/.github/sh/helpers.sh"

        # $SCRATCH is only mounted on the HPC side, not this runner -
        # resolve and create the target there, over ssh.
        scratch=$(helper_getVar SCRATCH)
        if [ -z "$scratch" ]; then
          echo "::warning::Could not resolve \$SCRATCH via hpc-batch - leaving .venv on this runner's own disk."
          exit 0
        fi

        venv_target="$scratch/tactus/github-runner/$GITHUB_RUN_ID/.venv"
        # A real venv, not an empty dir: poetry takes any existing .venv for a venv
        # and fails on a bare `python`. venv refuses a symlink path, so create it at the target.
        # System site-packages: the ecflow bindings live in the module python, not on PYTHONPATH.
        helper_exec "rm -rf '$venv_target'"
        helper_ml_exec "python3 -m venv --system-site-packages '$venv_target' && '$venv_target/bin/python' -c 'import ecflow'"

        rm -rf .venv
        ln -s "$venv_target" .venv
