name: Point .venv at $SCRATCH
description: Symlinks .venv into $SCRATCH (large quota) instead of this runner's small disk

runs:
  using: composite
  steps:
    - name: Point .venv at $SCRATCH
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_WORKSPACE/.github/sh/helpers.sh"

        # $SCRATCH is only mounted on the HPC side, not this runner -
        # resolve and create the target there, over ssh.
        scratch=$(helper_getVar SCRATCH)
        if [ -z "$scratch" ]; then
          echo "::warning::Could not resolve \$SCRATCH via hpc-batch - leaving .venv on this runner's own disk."
          exit 0
        fi

        venv_target="$scratch/tactus/github-runner/$GITHUB_RUN_ID/.venv"
        # Must exist before the symlink, or venv creation fails through it.
        helper_exec "rm -rf '$venv_target' && mkdir -p '$venv_target'"

        rm -rf .venv
        ln -s "$venv_target" .venv
