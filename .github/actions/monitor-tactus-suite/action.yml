name: Monitor tactus suite
description: Polls a submitted suite until terminal/timeout and summarizes PASS/FAIL

inputs:
  mode:
    description: compile or testbed
    required: true
  config_file:
    description: Resolved config file to monitor
    required: true
  default_timeout_minutes:
    description: Fallback timeout if TACTUS_SUITE_TIMEOUT_MINUTES isn't set
    required: true

outputs:
  artifact_paths:
    description: Newline-separated @CASEDIR@ paths on HPC scratch
    value: ${{ steps.monitor.outputs.artifact_paths }}
  status:
    description: PASS or FAIL
    value: ${{ steps.monitor.outputs.status }}

runs:
  using: composite
  steps:
    - id: monitor
      name: Follow suite(s) and summarize
      shell: bash
      run: |
        set -o pipefail
        set +e
        poetry run python scripts/ci/monitor_suite.py \
          --mode "${{ inputs.mode }}" \
          --config "${{ inputs.config_file }}" \
          --poll-interval-seconds "${{ env.TACTUS_POLL_INTERVAL_SECONDS || '60' }}" \
          --timeout-minutes "${{ env.TACTUS_SUITE_TIMEOUT_MINUTES || inputs.default_timeout_minutes }}" \
          --artifact-manifest ci_artifact_casedirs.txt
        rc=$?
        set -e

        # Manifest may be missing if monitor_suite.py crashed - don't let
        # that also break the GITHUB_OUTPUT write below.
        artifact_paths=""
        if [ -f ci_artifact_casedirs.txt ]; then
          artifact_paths=$(sed 's#$#/**#' ci_artifact_casedirs.txt)
        fi
        {
          echo "artifact_paths<<EOF_ARTIFACT_PATHS"
          echo "$artifact_paths"
          echo "EOF_ARTIFACT_PATHS"
        } >> "$GITHUB_OUTPUT"
        echo "status=$([ $rc -eq 0 ] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
        exit $rc
