name: Ensure poetry is available
description: Uses local poetry if adequate, else routes it over ssh to hpc-batch

outputs:
  has_local_poetry:
    description: "'true' if poetry runs locally, 'false' if routed over ssh"
    value: ${{ steps.ensure.outputs.has_local_poetry }}

runs:
  using: composite
  steps:
    - id: ensure
      name: Ensure poetry is available
      shell: bash
      run: |
        set -euo pipefail

        has_adequate_python() {
          command -v python3 >/dev/null 2>&1 &&
            python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)'
        }

        if has_adequate_python && command -v poetry >/dev/null 2>&1; then
          echo "has_local_poetry=true" >> "$GITHUB_OUTPUT"
          python3 --version
          poetry --version
          exit 0
        fi

        # No local python3 - route poetry over ssh to hpc-batch, which
        # loads python3/ecflow itself (see helper_ml_exec).
        echo "python3 not found locally - routing poetry calls to hpc-batch over ssh instead"
        echo "has_local_poetry=false" >> "$GITHUB_OUTPUT"

        shim_dir="$RUNNER_TEMP/poetry-remote-shim"
        mkdir -p "$shim_dir"
        cat > "$shim_dir/poetry" <<'EOF'
        #!/bin/bash
        set -euo pipefail
        source "$GITHUB_WORKSPACE/.github/sh/helpers.sh"
        printf -v args '%q ' "$@"
        helper_ml_exec "cd '$PWD' && poetry $args"
        EOF
        chmod +x "$shim_dir/poetry"
        echo "$shim_dir" >> "$GITHUB_PATH"
        export PATH="$shim_dir:$PATH"
        poetry --version
