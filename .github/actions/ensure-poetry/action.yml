name: Ensure poetry on HPC
description: Installs poetry on hpc-batch if missing (the runner has no python)

runs:
  using: composite
  steps:
    - name: Ensure poetry on HPC
      shell: bash
      run: |
        set -euo pipefail
        source "$GITHUB_WORKSPACE/.github/sh/helpers.sh"

        helper_py_exec poetry --version ||
          helper_py_exec bash -c 'curl -sSL https://install.python-poetry.org | python3 -'
        helper_py_exec poetry --version
