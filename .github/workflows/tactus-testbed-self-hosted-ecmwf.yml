#.github/workflows/tactus-testbed-self-hosted-ecmwf.yml
name: Tactus Testbed (self-hosted ECMWF)

# Triggered the same way as the reference HARMONIE self-hosted CI: any push
# (gated below to only actually run when the commit message contains
# "--action-testbed"; the pull_request.title/body checks are carried over
# from that reference for parity but are inert under a push-only trigger),
# or an explicit manual dispatch.

on:
  push:
  workflow_dispatch:
    inputs:
      test_config:
        description: Path to the test-suite config (relative to repo root)
        required: false
        default: tactus/data/tests/atos_bologna_CY49t2.toml
      case_selection:
        description: Comma-separated case names to restrict to (empty = all in test_config)
        required: false
        default: ""
      ial_tag:
        description: >-
          IAL ref to compile first and test against (branch/tag/commit).
          Mutually exclusive with ial_git_version. Leave both blank to test
          against each case's existing precompiled binaries, no compile.
        type: string
        default: ""
      ial_git_version:
        description: >-
          IAL ref to compile first and test against (branch/tag/commit).
          Mutually exclusive with ial_tag. Leave both blank to test against
          each case's existing precompiled binaries, no compile.
        type: string
        default: ""

env:
  GITHUB_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}
  # Empty (not a hardcoded default) unless the repo/org variable is set -
  # see run-testbed/action.yml and run-compile/action.yml: with it unset,
  # CI submits with no account override at all, identical to a plain manual
  # `tactus test -c ... -m -r`/`tactus compile` run. No equivalent QOS
  # variable on purpose - see those files for why forcing one QOS across
  # every submission type is actively wrong, not just unnecessary.
  TACTUS_WLM_ACCOUNT: ${{ vars.TACTUS_WLM_ACCOUNT }}
  TACTUS_POLL_INTERVAL_SECONDS: ${{ vars.TACTUS_POLL_INTERVAL_SECONDS }}
  TACTUS_SUITE_TIMEOUT_MINUTES: ${{ vars.TACTUS_SUITE_TIMEOUT_MINUTES }}
  # poetry.toml sets virtualenvs.options.system-site-packages = true (likely
  # for interactive HPC use, relying on module-provided library bindings).
  # That lets `poetry install` skip installing a package into .venv if it's
  # already visible via whatever module/system python is active at install
  # time - but the SLURM job that later runs tasks loads its own module set
  # (e.g. a different ecmwf-toolbox version), which can make that package
  # invisible again at run time (seen in practice: a
  # ModuleNotFoundError: No module named 'marshmallow', a sub-dependency of
  # json-schema-for-humans, inside a submitted job that ran fine through
  # `poetry install`). Override it for CI only, without touching
  # poetry.toml, so .venv is always fully self-contained here regardless of
  # which module happens to be loaded when a task actually runs.
  POETRY_VIRTUALENVS_OPTIONS_SYSTEM_SITE_PACKAGES: "false"

# Real integration cases share Atos scratch space and the reference-experiment
# tree, so - unlike compile - all testbed runs are deliberately serialized
# into a single global group (matches the reference repo's
# harmonie-testbed-ci group for the same reason).
concurrency:
  group: tactus-testbed-ci
  cancel-in-progress: false

jobs:
  testbed:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '--action-testbed') ||
      contains(github.event.pull_request.title, '--action-testbed') ||
      contains(github.event.pull_request.body, '--action-testbed')
    runs-on: [self-hosted, tactus]
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set github credentials
        uses: ./.github/actions/setup-github-credentials
        with:
          github_token: ${{ env.GITHUB_TOKEN }}

      - id: resolve
        name: Resolve IAL ref
        shell: bash
        run: |
          set -euo pipefail
          ial_tag="${{ github.event.inputs.ial_tag }}"
          ial_git_version="${{ github.event.inputs.ial_git_version }}"
          if [ -n "$ial_tag" ] && [ -n "$ial_git_version" ]; then
            echo "::error::Only one of ial_tag / ial_git_version may be set, not both." >&2
            exit 1
          fi
          ial_ref="${ial_tag}${ial_git_version}"
          if [ -n "$ial_ref" ]; then
            echo "should_compile=true" >> "$GITHUB_OUTPUT"
            echo "ial_ref=$ial_ref" >> "$GITHUB_OUTPUT"
          else
            echo "should_compile=false" >> "$GITHUB_OUTPUT"
            echo "ial_ref=" >> "$GITHUB_OUTPUT"
          fi

      - id: ensure_poetry
        name: Ensure poetry is available (locally with an adequate python, or via HPC ssh fallback)
        shell: bash
        run: |
          set -euo pipefail

          # README.md's own Atos setup instructions require
          # `module load python3/3.10.10-01` (plus `module load ecflow`) -
          # this runner's own default python3 can be too old on its own
          # (observed: 3.8.8; tactus needs >=3.10 per pyproject.toml's
          # requires-python). `module` itself needs Lmod's init script
          # sourced first - GH Actions runs steps via `bash --noprofile
          # --norc`, which skips whatever profile would normally do that.
          # Best-effort: harmless if this isn't Atos, or if python3 was
          # already adequate without it.
          lmod_init=/usr/local/apps/lmod/8.6.8/init/bash
          if [ -f "$lmod_init" ]; then
            # shellcheck disable=SC1090
            source "$lmod_init"
            module load python3/3.10.10-01 ecflow || true
          fi

          has_adequate_python() {
            command -v python3 >/dev/null 2>&1 &&
              python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)'
          }

          if has_adequate_python && command -v poetry >/dev/null 2>&1; then
            echo "has_local_poetry=true" >> "$GITHUB_OUTPUT"
            python3 --version
            poetry --version

            # Every subsequent step (and every composite-action step, e.g.
            # run-testbed/action.yml, run-compile/action.yml) is a fresh
            # shell that does NOT have the module above loaded - its
            # PATH/env changes don't otherwise survive past this step. Wrap
            # `poetry` in a shim that re-applies the same module load on
            # every invocation instead of trying to persist the whole
            # environment across steps.
            poetry_bin=$(command -v poetry)
            shim_dir="$RUNNER_TEMP/poetry-module-shim"
            mkdir -p "$shim_dir"
            cat > "$shim_dir/poetry" <<EOF
          #!/bin/bash
          set -euo pipefail
          if [ -f "$lmod_init" ]; then
            source "$lmod_init"
            module load python3/3.10.10-01 ecflow || true
          fi
          exec "$poetry_bin" "\$@"
          EOF
            chmod +x "$shim_dir/poetry"
            echo "$shim_dir" >> "$GITHUB_PATH"
            exit 0
          fi

          # Still no adequate python3/poetry, even after module load - don't
          # try to install one here. Instead, every subsequent `poetry ...`
          # call in this job is routed via helper_exec
          # (.github/sh/helpers.sh, copied from the reference HARMONIE
          # self-hosted CI) over ssh to hpc-batch, the same host
          # troika.yml's "hpc" site already ssh's to. This relies on the
          # runner's checkout and the HPC side sharing the same
          # filesystem/absolute paths, same as troika's own job submission
          # already assumes - and on hpc-batch's own login shell already
          # having an adequate python3/poetry via its default profile.
          echo "python3>=3.10/poetry not found locally, even after module load - routing poetry calls to hpc-batch over ssh instead"
          echo "has_local_poetry=false" >> "$GITHUB_OUTPUT"

          shim_dir="$RUNNER_TEMP/poetry-remote-shim"
          mkdir -p "$shim_dir"
          cat > "$shim_dir/poetry" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/sh/helpers.sh"
          printf -v args '%q ' "$@"
          # TACTUS_WLM_ACCOUNT no longer needs forwarding here:
          # run-testbed/action.yml and run-compile/action.yml resolve them to
          # literal values in their own (local) bash steps, before ever
          # invoking poetry/tactus - nothing downstream of this shim depends
          # on them being present in the remote environment.
          helper_exec "cd '$PWD' && poetry $args"
          EOF
          chmod +x "$shim_dir/poetry"
          echo "$shim_dir" >> "$GITHUB_PATH"
          export PATH="$shim_dir:$PATH"
          poetry --version

      - name: Install the project itself
        run: poetry install --no-interaction --only main,test

      - id: compile
        name: Compile IAL (if a version was given)
        if: steps.resolve.outputs.should_compile == 'true'
        uses: ./.github/actions/run-compile
        with:
          ial_tag: ${{ steps.resolve.outputs.ial_ref }}
          dry_run: "false"

      - name: Upload compile logs
        if: always() && steps.resolve.outputs.should_compile == 'true' && steps.compile.outputs.artifact_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: tactus-testbed-compile-${{ github.run_id }}
          path: ${{ steps.compile.outputs.artifact_paths }}
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup compile sub-step
        # Opt-in so suites/configs survive for debugging during development -
        # set the repo/org variable TACTUS_ECF_SUITES_AUTO_CLEANUP to 'true' to
        # auto-remove them; unset (or anything else) leaves them in place.
        if: always() && steps.resolve.outputs.should_compile == 'true' && vars.TACTUS_ECF_SUITES_AUTO_CLEANUP == 'true'
        uses: ./.github/actions/cleanup-tactus-run
        with:
          scope: compile
          config_file: ${{ steps.compile.outputs.config_file }}

      - id: testbed
        name: Run testbed via tactus
        uses: ./.github/actions/run-testbed
        with:
          test_config: ${{ github.event.inputs.test_config || vars.TACTUS_TEST_CONFIG || 'tactus/data/tests/atos_bologna_CY49t2.toml' }}
          case_selection: ${{ github.event.inputs.case_selection || vars.TACTUS_TESTBED_CASE_SELECTION || '' }}
          ial_version: ${{ steps.resolve.outputs.ial_ref }}

      - name: Upload testbed logs and check summaries
        # ci_status.txt/summary.json/summary.txt/*.diff live under each case's
        # @CASEDIR@ on HPC scratch, NOT under test_dir (which only ever holds
        # the generated *.toml configs on the runner's own checkout) - glob
        # against run-testbed's artifact_paths output instead of test_dir.
        if: always() && steps.testbed.outputs.artifact_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: tactus-testbed-${{ github.run_id }}
          path: ${{ steps.testbed.outputs.artifact_paths }}
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup
        # Opt-in so suites/configs survive for debugging during development -
        # set the repo/org variable TACTUS_ECF_SUITES_AUTO_CLEANUP to 'true' to
        # auto-remove them; unset (or anything else) leaves them in place.
        if: always() && vars.TACTUS_ECF_SUITES_AUTO_CLEANUP == 'true'
        uses: ./.github/actions/cleanup-tactus-run
        with:
          scope: testbed
          test_dir: ${{ steps.testbed.outputs.test_dir }}

      - name: Sweep any leftover suites for this run
        # Safety net on top of the per-case `tactus remove` above: catches
        # every suite still left for this run's unique tag, even if removing
        # one case crashed and left others behind too (see
        # scripts/ci/sweep_suites.sh for why). Same opt-in as the Cleanup
        # step above.
        if: always() && steps.testbed.outputs.run_tag != '' && vars.TACTUS_ECF_SUITES_AUTO_CLEANUP == 'true'
        continue-on-error: true
        shell: bash
        run: scripts/ci/sweep_suites.sh "${{ steps.testbed.outputs.run_tag }}"

      - name: Free local disk (poetry venv + cache)
        # This runner's local disk is small - don't rely on the next job's
        # checkout clean to reclaim this; free it as soon as this job ends.
        # .venv is in-project (poetry.toml) so it's local to the checkout;
        # poetry's download/package cache lives under $HOME and would
        # otherwise grow unbounded across runs/branches.
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf .venv
          rm -f ci_run_*.toml ci_artifact_casedirs.txt
          cache_dir=$(poetry config cache-dir 2>/dev/null)
          [ -n "$cache_dir" ] && rm -rf "$cache_dir"
          exit 0
