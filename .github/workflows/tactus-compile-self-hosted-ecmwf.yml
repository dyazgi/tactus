#.github/workflows/tactus-compile-self-hosted-ecmwf.yml
name: Tactus Compile (self-hosted ECMWF)

# Triggered the same way as the reference HARMONIE self-hosted CI: any push
# (gated below to only actually run when the commit message contains
# "--action-compile"; the pull_request.title/body checks are carried over
# from that reference for parity but are inert under a push-only trigger -
# they'd only fire if this workflow is ever also wired to pull_request), or
# an explicit manual dispatch.
on:
  push:
  workflow_dispatch:
    inputs:
      ial_tag:
        description: IAL ref to check out (branch/tag/commit). Mutually exclusive with ial_git_version; leave both blank to use config.toml's default.
        type: string
        default: ""
      ial_git_version:
        description: IAL ref to check out (branch/tag/commit). Mutually exclusive with ial_tag; leave both blank to use config.toml's default.
        type: string
        default: ""
      dry_run:
        description: Only generate the compile config, do not submit
        type: boolean
        default: false

env:
  GITHUB_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}
  # Empty (not a hardcoded default) unless the repo/org variable is set -
  # see run-compile/action.yml: with neither set, CI submits with no
  # account/QOS override at all, identical to a plain manual `tactus
  # compile` run.
  TACTUS_WLM_ACCOUNT: ${{ vars.TACTUS_WLM_ACCOUNT }}
  TACTUS_WLM_QOS: ${{ vars.TACTUS_WLM_QOS }}
  TACTUS_POLL_INTERVAL_SECONDS: ${{ vars.TACTUS_POLL_INTERVAL_SECONDS }}
  TACTUS_SUITE_TIMEOUT_MINUTES: ${{ vars.TACTUS_SUITE_TIMEOUT_MINUTES }}
  # poetry.toml sets virtualenvs.options.system-site-packages = true (likely
  # for interactive HPC use, relying on module-provided library bindings).
  # That lets `poetry install` skip installing a package into .venv if it's
  # already visible via whatever module/system python is active at install
  # time - but the SLURM job that later runs tasks loads its own module set
  # (e.g. a different ecmwf-toolbox version), which can make that package
  # invisible again at run time (seen in practice: a
  # ModuleNotFoundError: No module named 'marshmallow', a sub-dependency of
  # json-schema-for-humans, inside a submitted job that ran fine through
  # `poetry install`). Override it for CI only, without touching
  # poetry.toml, so .venv is always fully self-contained here regardless of
  # which module happens to be loaded when a task actually runs.
  POETRY_VIRTUALENVS_OPTIONS_SYSTEM_SITE_PACKAGES: "false"

# One compile per branch at a time (same workspace/install_dir would collide);
# unrelated branches are independent and may run concurrently, unlike the
# reference repo's unexplained blanket max-parallel: 1 across the whole matrix.
concurrency:
  group: tactus-compile-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  compile:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '--action-compile') ||
      contains(github.event.pull_request.title, '--action-compile') ||
      contains(github.event.pull_request.body, '--action-compile')
    runs-on: [self-hosted, tactus]
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set github credentials
        uses: ./.github/actions/setup-github-credentials
        with:
          github_token: ${{ env.GITHUB_TOKEN }}

      - id: resolve
        name: Resolve IAL ref
        shell: bash
        run: |
          set -euo pipefail
          ial_tag="${{ github.event.inputs.ial_tag }}"
          ial_git_version="${{ github.event.inputs.ial_git_version }}"
          if [ -n "$ial_tag" ] && [ -n "$ial_git_version" ]; then
            echo "::error::Only one of ial_tag / ial_git_version may be set, not both." >&2
            exit 1
          fi
          ial_ref="${ial_tag}${ial_git_version}"
          if [ -z "$ial_ref" ]; then
            ial_ref=$(grep -A5 '^\[compile\]' tactus/data/config_files/config.toml | grep 'ial_git_version' | head -1 | sed -E 's/.*=\s*"([^"]*)".*/\1/')
          fi
          echo "ial_ref=$ial_ref" >> "$GITHUB_OUTPUT"

      - id: ensure_poetry
        name: Ensure poetry is available (locally, or via HPC ssh fallback)
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1 && command -v poetry >/dev/null 2>&1; then
            echo "has_local_poetry=true" >> "$GITHUB_OUTPUT"
            poetry --version
            exit 0
          fi

          # This runner has no local python3/poetry - don't try to install
          # one here. Instead, every subsequent `poetry ...` call in this job
          # is routed via helper_exec (.github/sh/helpers.sh, copied from the
          # reference HARMONIE self-hosted CI) over ssh to hpc-batch, the
          # same host troika.yml's "hpc" site already ssh's to. This relies
          # on the runner's checkout and the HPC side sharing the same
          # filesystem/absolute paths, same as troika's own job submission
          # already assumes.
          echo "python3/poetry not found locally - routing poetry calls to hpc-batch over ssh instead"
          echo "has_local_poetry=false" >> "$GITHUB_OUTPUT"

          shim_dir="$RUNNER_TEMP/poetry-remote-shim"
          mkdir -p "$shim_dir"
          cat > "$shim_dir/poetry" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/sh/helpers.sh"
          printf -v args '%q ' "$@"
          # TACTUS_WLM_ACCOUNT/TACTUS_WLM_QOS no longer need forwarding here:
          # run-compile/action.yml resolves them to literal values in its
          # own (local) bash step, before ever invoking poetry/tactus -
          # nothing downstream of this shim depends on them being present in
          # the remote environment.
          helper_exec "cd '$PWD' && poetry $args"
          EOF
          chmod +x "$shim_dir/poetry"
          echo "$shim_dir" >> "$GITHUB_PATH"
          export PATH="$shim_dir:$PATH"
          poetry --version

      - name: Install the project itself
        run: poetry install --no-interaction --only main,test

      - id: compile
        name: Compile via tactus
        uses: ./.github/actions/run-compile
        with:
          ial_tag: ${{ steps.resolve.outputs.ial_ref }}
          dry_run: ${{ github.event.inputs.dry_run || 'false' }}

      - name: Upload compile logs
        # ci_status.txt (and anything else worth keeping) lives under
        # @CASEDIR@ on HPC scratch, not under the runner's local checkout -
        # see run-compile's artifact_paths output.
        if: always() && github.event.inputs.dry_run != 'true' && steps.compile.outputs.artifact_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: tactus-compile-${{ github.run_id }}
          path: ${{ steps.compile.outputs.artifact_paths }}
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup
        # Opt-in so suites/configs survive for debugging during development -
        # set the repo/org variable TACTUS_ECF_SUITES_AUTO_CLEANUP to 'true' to
        # auto-remove them; unset (or anything else) leaves them in place.
        if: always() && vars.TACTUS_ECF_SUITES_AUTO_CLEANUP == 'true'
        uses: ./.github/actions/cleanup-tactus-run
        with:
          scope: compile
          config_file: ${{ steps.compile.outputs.config_file }}

      - name: Free local disk (poetry venv + cache)
        # This runner's local disk is small - don't rely on the next job's
        # checkout clean to reclaim this; free it as soon as this job ends.
        # .venv is in-project (poetry.toml) so it's local to the checkout;
        # poetry's download/package cache lives under $HOME and would
        # otherwise grow unbounded across runs/branches.
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf .venv
          rm -f ci_artifact_casedirs.txt
          cache_dir=$(poetry config cache-dir 2>/dev/null)
          [ -n "$cache_dir" ] && rm -rf "$cache_dir"
          exit 0
