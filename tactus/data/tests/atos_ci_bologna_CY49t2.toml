[general]
  reference_date = "2026-06-18T00:00:00Z"
  # Small, fast CI smoke-test subset of atos_bologna_CY49t2.toml's full
  # selection - one model family's forecast case plus its required
  # "host" prerequisite (see case_definitions_CY49t2.toml: cy49t2_alaro/
  # cy49t2_arome both set host = "..._climate_files", so that prerequisite
  # must stay selected alongside it). Skips the ddh/eps/slaf/mode_start/
  # R64/target variants and harmonie_arome entirely to keep runtime down.
  selection = [
    "cy49t2_alaro_climate_files",
    "cy49t2_alaro",
    "cy49t2_arome_climate_files",
    "cy49t2_arome",
  ]

[general.compiler.gnu]
  active = false
  extra = [
    "tactus/data/config_files/modifications/submission/atos_bologna_gnu.toml",
    "tactus/data/config_files/modifications/submission/atos_bologna_gnu_CY49t2.toml"
  ]

[general.compiler.intel]
  active = true

[include]
  cases = "case_definitions_CY49t2.toml"
  macros = "test_macros.toml"
  modifs = "modifs_atos_bologna_CY49t2.toml"
  refchecks = "modifs_reference_checker.toml"
  genchecks = "modifs_reference_generate.toml"
