# CI overlay for self-hosted GitHub Actions runs on Atos Bologna ONLY.
#
# This is *not* meant for interactive/manual use. It is layered on top of
# `submission/atos_bologna.toml` (e.g. via the positional config-modification
# files accepted by `tactus case`, the same mechanism already used for e.g.
# `modifications/compile_suite.toml`) to inject the real SLURM account/QOS that
# CI jobs must submit under, instead of hardcoding them in workflow YAML.
#
# `@TACTUS_WLM_ACCOUNT@`/`@TACTUS_WLM_QOS@` are resolved the same way every other
# `@VAR@` placeholder in this config tree is: via `Platform.substitute()`, which
# (for an `os_macros` entry, see `[macros.select.ci]` below) reads the value
# straight from the identically-named environment variable. The CI workflow is
# expected to `export TACTUS_WLM_ACCOUNT=...`/`export TACTUS_WLM_QOS=...` (sourced
# from `vars.TACTUS_WLM_ACCOUNT`/`vars.TACTUS_WLM_QOS`) before invoking
# `tactus compile`/`tactus case`/`tactus test`.
#
# Usage:
#   tactus compile --ial-tag <tag> tactus/data/config_files/modifications/ci_atos_bologna.toml
#   tactus test -c <test_config> ...   (test configs list their modifs via [include])
#
# `tactus compile`'s `extra_config_mods` positional argument (added alongside this
# file) appends any given files after its own hardcoded `@HOST@.toml`/
# `compile_suite.toml` modifications, so this file is passed the same way `tactus
# case`'s positional `config_mods` already works.

[macros.select.ci]
  # Makes `@TACTUS_WLM_ACCOUNT@`/`@TACTUS_WLM_QOS@` resolve from the environment,
  # following the exact same convention as e.g. `macros.select.leonardo` (see
  # `tactus/data/config_files/modifications/leonardo.toml`).
  os_macros = ["TACTUS_WLM_ACCOUNT", "TACTUS_WLM_QOS"]

[compile]
  # ECMWF's self-hosted CI must build from the Hirlam fork of IAL, not the
  # ACCORD-NWP upstream `compile.ial_git_repo` default
  # (`tactus/data/config_files/config.toml`) - see `IALClone`
  # (`tactus/tasks/compilation.py`), which just does a plain
  # `git clone <ial_git_repo> <ial_dir>`, so any git-clonable URL works here.
  ial_git_repo = "https://github.com/Hirlam/IAL"

[submission]
  # `submission.account` is the one *global* fallback tactus already supports
  # (see `tactus/submission.py`'s `parse_job`): it is applied to every task's
  # BATCH settings unless that task (or its submission "type") sets its own
  # `account`. No such per-task override exists anywhere in
  # `submission/atos_bologna.toml`/`modifications/atos_bologna.toml` today, so
  # this alone covers every SLURM job submitted by CI.
  account = "#SBATCH --account=@TACTUS_WLM_ACCOUNT@"

# There is no equivalent global fallback for QOS, so every BATCH section that
# currently hardcodes a QOS in `submission/atos_bologna.toml` is overridden here
# individually. This covers every task/type that submits a real SLURM job on
# atos_bologna:
#   - submission.types.gnu/parallel/serial: the generic per-submission-type
#     QOS inherited by the vast majority of tasks (Forecast, Pgd, Prep, C903,
#     E927, CreateGrib, Topography, Soil, Marsprep, ...).
#   - submission.task_exceptions.TactusBundleBuild: compile-suite build job.
#   - submission.task_exceptions.Marsprep: has its own task-level QOS override
#     that would otherwise take precedence over `types.serial`'s.
[submission.types.gnu.BATCH]
  QOS = "#SBATCH --qos=@TACTUS_WLM_QOS@"

[submission.types.parallel.BATCH]
  QOS = "#SBATCH --qos=@TACTUS_WLM_QOS@"

[submission.types.serial.BATCH]
  QOS = "#SBATCH --qos=@TACTUS_WLM_QOS@"

[submission.task_exceptions.TactusBundleBuild.BATCH]
  QOS = "#SBATCH --qos=@TACTUS_WLM_QOS@"

[submission.task_exceptions.Marsprep.BATCH]
  QOS = "#SBATCH --qos=@TACTUS_WLM_QOS@"
